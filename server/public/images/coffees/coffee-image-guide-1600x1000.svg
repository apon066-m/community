<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" fill="none">
  <title>Coffee image composition guide, 1600 by 1000 pixels</title>
  <desc>Transparent 16 by 10 image guide with a centered safe subject area.</desc>

  <path
    d="M0 0h1600v1000H0zM240 150h1120v700H240z"
    fill="#111827"
    fill-opacity=".22"
    fill-rule="evenodd"
  />

  <rect
    x="2"
    y="2"
    width="1596"
    height="996"
    stroke="#F97316"
    stroke-width="4"
    stroke-dasharray="18 12"
  />

  <rect
    x="240"
    y="150"
    width="1120"
    height="700"
    stroke="#22D3EE"
    stroke-width="5"
    stroke-dasharray="24 14"
  />

  <path d="M800 150v700M240 500h1120" stroke="#22D3EE" stroke-width="2" stroke-opacity=".75" />
  <circle cx="800" cy="500" r="12" fill="#F97316" />

  <g fill="#FFFFFF" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="800" y="116" font-size="30" font-weight="700" letter-spacing="4">SAFE SUBJECT AREA</text>
    <text x="800" y="940" font-size="26" letter-spacing="3">1600 × 1000 PX · 16:10</text>
  </g>
</svg>
