services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cafe_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-cafe_app}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cafe_app} -d ${POSTGRES_DB:-cafe_app}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    environment:
      APP_NAME: ${APP_NAME:-Coffee Platform}
      NODE_ENV: development
      PORT: "3000"
      VITE_APP_NAME: ${APP_NAME:-Coffee Platform}
      VITE_SERVER_URL: ${VITE_SERVER_URL:-http://localhost:3000}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-development-secret-at-least-32-characters}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-local-google-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-local-google-client-secret}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-cafe_app}:${POSTGRES_PASSWORD:-local_dev_password}@db:5432/${POSTGRES_DB:-cafe_app}"
    ports:
      - "127.0.0.1:5173:5173"
      - "127.0.0.1:3000:3000"
    volumes:
      - ./server/public/assets:/app/server/public/assets
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const responses = await Promise.all([fetch('http://127.0.0.1:5173'), fetch('http://127.0.0.1:3000/health')]); if (responses.some((r) => !r.ok)) process.exit(1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    develop:
      watch:
        - action: sync
          path: ./client
          target: /app/client
          initial_sync: true
          ignore:
            - node_modules/
            - dist/
        - action: sync
          path: ./server
          target: /app/server
          initial_sync: true
          ignore:
            - node_modules/
            - dist/
            - bun.lock
            - public/assets/
        - action: sync
          path: ./shared
          target: /app/shared
          initial_sync: true
          ignore:
            - node_modules/
            - dist/

volumes:
  postgres-data: